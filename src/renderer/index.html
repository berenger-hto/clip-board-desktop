<!DOCTYPE html>
<html class="dark" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com;">

    <title>ClipboardX</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#258cf4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "mac-close": "#ff5f57",
                        "mac-minimize": "#ffbd2e",
                        "mac-maximize": "#28c940"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>

    <style type="text/css">
        /* Permet de déplacer la fenêtre en restant cliquable sur les boutons */
        .titlebar {
            -webkit-app-region: drag;
        }

        .no-drag {
            -webkit-app-region: no-drag;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(37, 140, 244, 0.2);
            border-radius: 10px;
        }

        .clipboard-tile:hover .tile-actions {
            opacity: 1;
        }

        pre {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col overflow-hidden">

    <nav
        class="titlebar h-10 flex items-center justify-between px-4 bg-background-light dark:bg-background-dark border-b border-primary/10 select-none relative">
        <div class="flex items-center gap-2 w-[100px] z-10 no-drag">
            <button onclick="window.close()"
                class="w-3 h-3 rounded-full bg-mac-close border border-black/10 flex items-center justify-center group">
                <span
                    class="material-icons-outlined text-[8px] text-black/50 opacity-0 group-hover:opacity-100">close</span>
            </button>
            <button id="min-btn"
                class="w-3 h-3 rounded-full bg-mac-minimize border border-black/10 flex items-center justify-center group">
                <span
                    class="material-icons-outlined text-[8px] text-black/50 opacity-0 group-hover:opacity-100">remove</span>
            </button>
            <button id="max-btn"
                class="w-3 h-3 rounded-full bg-mac-maximize border border-black/10 flex items-center justify-center group">
                <span
                    class="material-icons-outlined text-[8px] text-black/50 opacity-0 group-hover:opacity-100">add</span>
            </button>
        </div>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="flex items-center gap-2">
                <span class="material-icons-outlined text-primary text-sm">content_paste</span>
                <h1 class="text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400">ClipboardX
                </h1>
            </div>
        </div>
        <div class="w-[100px]"></div>
    </nav>

    <main class="flex-1 flex overflow-hidden">
        <section class="w-[70%] flex flex-col border-r border-primary/5">
            <div class="p-8 pb-4">
                <h2 class="text-2xl font-bold mb-6">Historique</h2>
                <div class="relative group no-drag">
                    <span
                        class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors">search</span>
                    <input
                        class="w-full bg-slate-200/50 dark:bg-primary/5 border-transparent focus:border-primary/30 focus:ring-0 rounded-xl py-4 pl-12 pr-4 text-sm outline-none"
                        placeholder="Rechercher..." type="text" />
                </div>
            </div>

            <div id="clipboard-list" class="flex-1 overflow-y-auto px-8 pb-8 space-y-4">
                <div
                    class="clipboard-tile group relative bg-white dark:bg-primary/5 border border-primary/5 rounded-xl p-5 transition-all shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <pre
                            class="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap">git commit -m "feat: implement mobile sync"</pre>
                        <div class="tile-actions opacity-0 transition-opacity flex gap-2 no-drag">
                            <button class="p-2 bg-primary/10 hover:bg-primary text-primary hover:text-white rounded-lg">
                                <span class="material-icons-outlined text-sm">content_copy</span>
                            </button>
                            <button class="p-2 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white rounded-lg">
                                <span class="material-icons-outlined text-sm">delete</span>
                            </button>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] font-medium text-slate-400 uppercase">Copié il y a 5 min</span>
                    </div>
                </div>
            </div>
        </section>

        <aside class="w-[30%] bg-slate-50 dark:bg-primary/5 p-8 flex flex-col">
            <h2 class="text-lg font-bold mb-8">Connexion Mobile</h2>
            <div class="flex flex-col items-center justify-center mb-10">
                <div class="bg-white p-4 rounded-2xl shadow-xl mb-6 no-drag">
                    <div id="qrcode" class="w-40 h-40 bg-slate-100 flex items-center justify-center text-slate-400">
                        <span class="material-icons-outlined text-4xl">qr_code_2</span>
                    </div>
                </div>
                <p class="text-sm text-slate-500 text-center mb-6">Scannez avec l'app mobile</p>
                <button
                    class="no-drag flex items-center gap-2 px-6 py-2.5 bg-primary/10 hover:bg-primary text-primary hover:text-white text-sm font-semibold rounded-full border border-primary/20 transition-all">
                    <span class="material-icons-outlined text-sm">refresh</span>
                    Actualiser QR
                </button>
            </div>

            <div class="mt-auto space-y-3 no-drag">
                <button
                    class="w-full flex items-center justify-center gap-2 py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl shadow-lg shadow-red-500/20">
                    <span class="material-icons-outlined text-[18px]">delete_sweep</span>
                    Vider l'Historique
                </button>
            </div>
        </aside>
    </main>

    <footer
        class="h-8 flex items-center px-4 bg-slate-100 dark:bg-background-dark/80 border-t border-primary/5 text-[10px] text-slate-500 uppercase tracking-widest font-medium">
        <div class="flex gap-4">
            <span>Version 2.4.0</span>
            <span id="item-count">0 Éléments en mémoire</span>
        </div>
    </footer>

    <script>
        // ICI : Logique pour communiquer avec ton Main Process Electron
        // Utilise window.ipcRenderer si tu as activé le nodeIntegration ou un preload script
    </script>
</body>

</html>
