<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ClipboardX Loading Skeleton</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#258cf4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "neutral-skeleton": "#1c2632",
                        "neutral-shimmer": "#2a3746",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        .skeleton-shimmer {
            background: linear-gradient(90deg, #1c2632 25%, #2a3746 50%, #1c2632 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-white min-h-screen flex items-center justify-center p-4">
<!-- Main Desktop Window Simulation -->
<div class="w-full max-w-6xl h-[800px] bg-background-light dark:bg-background-dark border border-white/5 shadow-2xl rounded-xl overflow-hidden flex flex-col">
<!-- Mac-Style Title Bar -->
<div class="h-10 bg-neutral-skeleton/50 flex items-center px-4 relative border-b border-white/5">
<!-- Window Controls -->
<div class="flex gap-2">
<div class="w-3.2 h-3.2 rounded-full bg-[#ff5f57] w-3 h-3"></div>
<div class="w-3.2 h-3.2 rounded-full bg-[#febc2e] w-3 h-3"></div>
<div class="w-3.2 h-3.2 rounded-full bg-[#28c840] w-3 h-3"></div>
</div>
<!-- Centered Title Placeholder -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-32 h-2.5 rounded-full skeleton-shimmer"></div>
</div>
</div>
<!-- Dashboard Layout -->
<div class="flex flex-1 overflow-hidden">
<!-- Sidebar (Left Column - 70%) -->
<div class="w-[70%] border-r border-white/5 flex flex-col p-6 space-y-6 overflow-y-auto">
<!-- Header Section -->
<div class="space-y-4">
<div class="w-40 h-8 rounded-lg skeleton-shimmer"></div>
<div class="w-full h-12 rounded-xl skeleton-shimmer border border-white/5"></div>
</div>
<!-- Clipboard List Items -->
<div class="space-y-3">
<!-- List Item 1 (Active State Simulation) -->
<div class="p-4 rounded-xl bg-primary/5 border border-primary/20 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="w-3/4 h-3 rounded-full skeleton-shimmer"></div>
<div class="w-1/2 h-3 rounded-full skeleton-shimmer opacity-60"></div>
</div>
<div class="flex gap-2 ml-4">
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
</div>
</div>
<!-- List Item 2 -->
<div class="p-4 rounded-xl bg-neutral-skeleton/20 border border-white/5 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="w-5/6 h-3 rounded-full skeleton-shimmer"></div>
<div class="w-2/3 h-3 rounded-full skeleton-shimmer opacity-60"></div>
</div>
<div class="flex gap-2 ml-4">
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
</div>
</div>
<!-- List Item 3 -->
<div class="p-4 rounded-xl bg-neutral-skeleton/20 border border-white/5 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="w-full h-3 rounded-full skeleton-shimmer"></div>
<div class="w-1/3 h-3 rounded-full skeleton-shimmer opacity-60"></div>
</div>
<div class="flex gap-2 ml-4">
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
</div>
</div>
<!-- List Item 4 -->
<div class="p-4 rounded-xl bg-neutral-skeleton/20 border border-white/5 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="w-4/6 h-3 rounded-full skeleton-shimmer"></div>
<div class="w-2/5 h-3 rounded-full skeleton-shimmer opacity-60"></div>
</div>
<div class="flex gap-2 ml-4">
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
</div>
</div>
<!-- List Item 5 -->
<div class="p-4 rounded-xl bg-neutral-skeleton/20 border border-white/5 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="w-3/5 h-3 rounded-full skeleton-shimmer"></div>
<div class="w-1/4 h-3 rounded-full skeleton-shimmer opacity-60"></div>
</div>
<div class="flex gap-2 ml-4">
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
<div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
</div>
</div>
</div>
</div>
<!-- Details Pane (Right Column - 30%) -->
<div class="w-[30%] bg-neutral-skeleton/10 p-8 flex flex-col items-center">
<!-- QR Code Placeholder -->
<div class="w-48 h-48 rounded-xl skeleton-shimmer shadow-lg mb-8"></div>
<!-- Metadata Lines -->
<div class="w-full space-y-4 mb-auto">
<div class="space-y-2">
<div class="w-1/3 h-2.5 rounded-full skeleton-shimmer opacity-40"></div>
<div class="w-full h-3 rounded-full skeleton-shimmer"></div>
</div>
<div class="space-y-2">
<div class="w-1/4 h-2.5 rounded-full skeleton-shimmer opacity-40"></div>
<div class="w-4/5 h-3 rounded-full skeleton-shimmer"></div>
</div>
<div class="space-y-2">
<div class="w-2/5 h-2.5 rounded-full skeleton-shimmer opacity-40"></div>
<div class="w-3/4 h-3 rounded-full skeleton-shimmer"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-3 mt-8">
<div class="w-full h-11 rounded-lg skeleton-shimmer"></div>
<div class="flex gap-3">
<div class="flex-1 h-11 rounded-lg skeleton-shimmer opacity-70"></div>
<div class="flex-1 h-11 rounded-lg skeleton-shimmer opacity-70"></div>
</div>
</div>
</div>
</div>
<!-- Footer Simulation -->
<div class="h-8 bg-neutral-skeleton/30 border-t border-white/5 flex items-center justify-between px-6">
<div class="w-24 h-2 rounded-full skeleton-shimmer opacity-30"></div>
<div class="w-32 h-2 rounded-full skeleton-shimmer opacity-30"></div>
</div>
</div>
<!-- Visual Hint (Bottom) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-3 px-4 py-2 bg-white/5 backdrop-blur-md rounded-full border border-white/10">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-xs font-medium text-white/50 tracking-wide uppercase">Syncing Clipboard History...</span>
</div>
</body></html>
